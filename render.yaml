# Render Blueprint — StockWise (backend API + frontend UI as two services)
#
# Setup: Render Dashboard → New → Blueprint → point at this GitHub repo and the
# branch that contains this file. Render reads it, creates both services and wires
# the UI to the API.
services:
  - type: web
    name: stockwise-api
    runtime: node
    # The backend lives in stockwise/backend, so every command runs from there.
    # Files outside rootDir are not available to the build or runtime.
    rootDir: stockwise/backend
    # Free plan: the filesystem is ephemeral, so the SQLite file is re-created
    # and re-seeded (~200ms) on every restart/redeploy — no errors, demo data
    # comes back automatically. To keep data across restarts, upgrade to a paid
    # plan, attach a Disk (e.g. mounted at /var/data) and uncomment DB_PATH.
    plan: free
    # npm ci installs strictly from package-lock.json. --include=dev is required
    # because NODE_ENV=production (which Render sets) would drop TypeScript.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # - key: DB_PATH
      #   value: /var/data/stockwise.db

  - type: web
    name: stockwise-ui
    runtime: node
    # The frontend has no dependencies and no build step: it serves the static
    # files and proxies /api/* to the API service above.
    rootDir: stockwise/frontend
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      # The API's *public* URL. `property: host` would return the private-network
      # hostname, which a Free web service cannot receive traffic on.
      - key: API_TARGET
        fromService:
          type: web
          name: stockwise-api
          envVarKey: RENDER_EXTERNAL_URL
